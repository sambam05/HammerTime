plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'

    id 'java'
    id 'com.github.johnrengelman.shadow' version "8.1.1"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenCentral()
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation("com.terraformersmc:modmenu:${project.modmenu}")

    // Make it available to compile
    implementation("com.electronwill.night-config:toml:3.6.4")
    shadow("com.electronwill.night-config:toml:3.6.4")
}

sourceSets {
    main {
        resources {
            srcDirs += "src/generated/resources"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/hammermining.accesswidener")
    runs {
        datagen {
            client()
            server()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${projectDir}/src/generated/resources"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }

}
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import net.fabricmc.loom.task.RemapJarTask

// Shadow jar to embed night-config
tasks.named('shadowJar', ShadowJar) {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("shadow") // TEMP classifier to avoid conflict
    relocate('com.electronwill.nightconfig', 'com.sheath.libs.nightconfig')
}


// Ensure remapped jar uses shadowed jar as input
tasks.named("remapJar", RemapJarTask).configure {
    dependsOn(tasks.named("shadowJar"))

    def shadowTask = tasks.named("shadowJar", ShadowJar).get()
    inputFile.set(shadowTask.archiveFile)
}



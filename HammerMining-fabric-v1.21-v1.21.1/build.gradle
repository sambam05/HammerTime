import java.util.Locale

plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'

    id 'java'
    id 'com.github.johnrengelman.shadow' version "8.1.1"
}

def supportedMinecraftVersions = [
        "1.21": [
                minecraft: "1.21",
                yarn     : "1.21+build.9",
                loader   : "0.17.3",
                fabric   : "0.102.0+1.21",
                modmenu  : "11.0.3"
        ],
        "1.21.1": [
                minecraft: "1.21.1",
                yarn     : "1.21.1+build.3",
                loader   : "0.17.3",
                fabric   : "0.116.7+1.21.1",
                modmenu  : "11.0.3"
        ]
]

def targetMinecraftVersion = (project.findProperty("minecraft_target")
        ?: project.findProperty("minecraft_version")
        ?: "1.21.1").toString()

if (!supportedMinecraftVersions.containsKey(targetMinecraftVersion)) {
    throw new GradleException("Unsupported Minecraft version: ${targetMinecraftVersion}. Supported versions: " +
            supportedMinecraftVersions.keySet().join(', '))
}

def versionConfig = supportedMinecraftVersions[targetMinecraftVersion]
ext.set("minecraft_version", versionConfig.minecraft)
ext.set("yarn_mappings", versionConfig.yarn)
ext.set("loader_version", versionConfig.loader)
ext.set("fabric_version", versionConfig.fabric)
ext.set("modmenu", versionConfig.modmenu)
logger.lifecycle("Building HammerMining for Minecraft {}", targetMinecraftVersion)

version = "${project.mod_version}+mc${targetMinecraftVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    mavenCentral()
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation("com.terraformersmc:modmenu:${project.modmenu}")

    // Make it available to compile
    implementation("com.electronwill.night-config:toml:3.8.1")
    shadow("com.electronwill.night-config:toml:3.8.1")
}

sourceSets {
    main {
        resources {
            srcDirs += "src/generated/resources"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/hammermining.accesswidener")
    runs {
        datagen {
            client()
            server()
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${projectDir}/src/generated/resources"
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }

}
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import net.fabricmc.loom.task.RemapJarTask

// Shadow jar to embed night-config
tasks.named('shadowJar', ShadowJar) {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("shadow") // TEMP classifier to avoid conflict
    relocate('com.electronwill.nightconfig', 'com.sheath.libs.nightconfig')
}


// Ensure remapped jar uses shadowed jar as input
tasks.named("remapJar", RemapJarTask).configure {
    dependsOn(tasks.named("shadowJar"))

    def shadowTask = tasks.named("shadowJar", ShadowJar).get()
    inputFile.set(shadowTask.archiveFile)
}

def isWindows = System.getProperty("os.name").toLowerCase(Locale.ENGLISH).contains("win")
def gradlewCommand = isWindows ? ["cmd.exe", "/c", "gradlew.bat"] : ["./gradlew"]
def commonGradleArgs = ["--console=plain", "--no-daemon"]

supportedMinecraftVersions.keySet().each { versionKey ->
    def taskSuffix = versionKey.replace('.', '_')
    tasks.register("buildFor${taskSuffix}") {
        group = "build"
        description = "Builds the mod for Minecraft ${versionKey}."
        doLast {
            logger.lifecycle("Running build for Minecraft {}", versionKey)
            exec {
                workingDir = rootDir
                commandLine(gradlewCommand + ["build"] + commonGradleArgs + ["-Pminecraft_target=${versionKey}"])
            }
        }
    }
}

tasks.register("buildAllSupported") {
    group = "build"
    description = "Builds the mod for all supported Minecraft versions."
    doLast {
        supportedMinecraftVersions.keySet().each { versionKey ->
            logger.lifecycle("Building all targets - now running {}", versionKey)
            exec {
                workingDir = rootDir
                commandLine(gradlewCommand + ["build"] + commonGradleArgs + ["-Pminecraft_target=${versionKey}"])
            }
        }
    }
}

